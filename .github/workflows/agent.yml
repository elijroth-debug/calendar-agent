name: calendar-agent

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 13 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which alert to send"
        type: choice
        options:
          - briefing
          - preview
          - reminder
        default: briefing

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests icalendar recurring-ical-events
      - run: python agent.py
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          ICS_URLS: ${{ secrets.ICS_URLS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '*/15 * * * *' && 'reminder') || (github.event.schedule == '0 2 * * *' && 'preview') || 'briefing' }}
